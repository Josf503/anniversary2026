<!DOCTYPE html>
<html>
<head>
  <title>25th Wedding Anniversary</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to right, #ffb6c1, #ffe4e1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Comic Sans MS", cursive;
      animation: fadeIn 1s;
      overflow: hidden;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 12px 25px rgba(0,0,0,0.2);
      z-index: 1;
    }

    button {
      margin: 8px;
      padding: 12px 25px;
      border: none;
      border-radius: 20px;
      background: #d6336c;
      color: white;
      cursor: pointer;
    }

    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-100vh); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Happy 25th Wedding Anniversary 💍</h1>
  <p>25 Years of Love & Togetherness ❤️</p>

  <!-- Removed Play Music button -->
  <button onclick="location.href='photos.html'">Photos 📸</button>
  <button onclick="location.href='timeline.html'">Our Journey 📜</button>
</div>

<audio id="bg-music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
  const music = document.getElementById("bg-music");

  if (localStorage.getItem("musicPlaying") === "true") {
    music.play();
  }

  // Floating hearts
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "❤️";
    h.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 6000);
  }, 500);

  // Confetti
  for (let i = 0; i < 80; i++) {
    const c = document.createElement("div");
    c.style.position = "fixed";
    c.style.top = "-10px";
    c.style.left = Math.random() * 100 + "vw";
    c.style.width = "8px";
    c.style.height = "8px";
    c.style.background = ["#ff69b4","#ffd700","#ff4500"][Math.floor(Math.random()*3)];
    document.body.appendChild(c);
    c.animate([{transform:"translateY(0)"},{transform:"translateY(100vh)"}],
              {duration:3000});
    setTimeout(() => c.remove(), 3000);
  }
</script>

</body>
</html>
